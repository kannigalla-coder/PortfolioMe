<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>จัดการพอร์ตโฟลิโอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #editor{width:100%;min-height:60vh;font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;tab-size:2}
  .msgs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .msgs li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:4px}
  .msgs .meta{font-size:13px;color:var(--muted);font-family:var(--mono)}
  .msgs p{white-space:pre-wrap}
  .msgs .btn{font-size:13px;padding:4px 12px}
</style>
<script type="module" src="js/admin.js"></script>
</head>
<body>
<div class="wrap">
  <header style="grid-template-columns:1fr auto">
    <div>
      <h1 style="font-size:32px">จัดการพอร์ตโฟลิโอ</h1>
      <p class="intro" id="who">กำลังตรวจสอบการเข้าสู่ระบบ…</p>
    </div>
    <div class="bar">
      <a class="btn ghost" href="./">ดูหน้าเว็บ</a>
      <button class="btn" id="login" type="button" hidden>เข้าสู่ระบบด้วย Google</button>
      <button class="btn ghost" id="logout" type="button" hidden>ออกจากระบบ</button>
    </div>
  </header>

  <div id="panel" hidden>
    <section>
      <div class="sec-head"><h2>ข้อมูลเรซูเม่</h2><span class="label">Firestore · site/resume</span></div>
      <p class="status" style="margin-bottom:12px">แก้ข้อความใน JSON แล้วกดบันทึก หน้าเว็บจะแสดงข้อมูลใหม่ทันทีที่มีคนเปิด</p>
      <textarea id="editor" spellcheck="false" aria-label="ข้อมูลเรซูเม่ (JSON)"></textarea>
      <div class="bar" style="margin-top:12px">
        <button class="btn" id="save" type="button">บันทึก</button>
        <button class="btn ghost" id="reset" type="button">โหลดค่าจากไฟล์ data/resume.json</button>
        <span id="save-status" class="status" role="status"></span>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>ข้อความจากผู้เยี่ยมชม</h2><span class="label">Firestore · messages</span></div>
      <p id="msg-empty" class="status" hidden>ยังไม่มีข้อความ</p>
      <ul class="msgs" id="msgs"></ul>
    </section>
  </div>
</div>
</body>
</html>
